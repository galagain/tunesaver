[download]
# 5 = MP3 320, 6 = lossless, 7 = hi-res <= 96 kHz, 27 = hi-res > 96 kHz.
default_quality = 27
default_limit = 20
no_m3u = false
albums_only = false
no_fallback = false
og_cover = false
embed_art = false
no_cover = false
no_database = false
folder_format = {artist} - {album} ({year}) [{bit_depth}B-{sampling_rate}kHz]
track_format = {tracknumber}. {tracktitle}
smart_discography = false
