# Optional, self-contained PostgreSQL deployment. No external network required.
services:
  web:
    env_file:
      - path: "${TUNESAVER_DATABASE_ENV:-.env.database}"
        required: true
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:16.14
    restart: unless-stopped
    environment:
      POSTGRES_USER: tunesaver_owner
      POSTGRES_DB: tunesaver
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    env_file:
      - path: "${TUNESAVER_DATABASE_ENV:-.env.database}"
        required: true
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-tunesaver.sh:ro
      - ./migrations:/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tunesaver_owner -d tunesaver"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
secrets:
  postgres_password:
    file: ./secrets/postgres_password
volumes:
  postgres_data: {}
