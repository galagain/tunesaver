<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexions · TuneSaver</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/account-transfer.css"></head><body><main class="transfer-panel"><a href="/">TUNESAVER</a><h1>Retrouver mes plateformes</h1><p id="transfer-account">Connecte-toi avec le compte autorisé par l’administrateur.</p><form id="transfer-form"><div id="transfer-login"><label>E-mail<input name="email" type="email" autocomplete="username" required></label><label>Mot de passe TuneSaver<input name="password" type="password" autocomplete="current-password" required></label></div><fieldset><legend>Plateformes à importer</legend><label><input type="checkbox" name="provider" value="tiddl" checked> TIDAL</label><label><input type="checkbox" name="provider" value="beatport" checked> Beatport</label><label><input type="checkbox" name="provider" value="qobuz"> Qobuz</label></fieldset><p>Ce fichier contient les accès aux comptes des plateformes. Garde-le privé et supprime-le après l’import.</p><button type="submit">Télécharger mes connexions</button></form><p id="transfer-status" role="status"></p><p>Dans TuneSaver : <strong>Mes plateformes → Importer un fichier</strong>.</p></main><script src="/account-transfer.js" defer></script></body></html>
